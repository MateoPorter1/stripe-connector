name: Wake recovery worker
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: recovery-worker-wake
  cancel-in-progress: false
jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the existing backend (no customer data or secrets)
        run: curl --fail --silent --show-error --retry 2 --retry-delay 10 --max-time 120 https://stripe-connector-backend.onrender.com/api/health
